<div class="header-container">
    <header class="header-content">

        <nav class="navigation">
            <div class="logo-col">
                <a routerLink="/">
                    <img id="strype-logo" src="/assets/STRYPE-LOGO.png" alt="Logo da Strype">
                </a>
            </div>

            <button class="menu-toggle" (click)="toggleMenu()" aria-label="Abrir menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="col-1" [class.menu-open]="menuAberto">
                <a routerLink="#">Adidas</a>
                <a routerLink="#">Nike</a>
                <a routerLink="#">The North Face</a>
                <a routerLink="#">Midias e equipamentos</a>
                <a routerLink="#">Login</a>
            </div>
        </nav>

        <div class="col-2">
            <div class="search-bar">
                <img
                    src="/assets/SEARCH-ICON.png"
                    alt="Icone de pesquisa"
                    id="search-icon"
                >

                <input type="text" placeholder="Pesquisar">
            </div>

            <div class="icons">
                <a routerLink="#">
                    <img src="/assets/CART-ICON.png" alt="Icone de Carrinho" id="cart-icon">
                </a>

                <a routerLink="#">
                    <img src="/assets/USER-ICON.png" alt="Icone de usuario" id="user-icon">
                </a>
            </div>
        </div>

    </header>
</div>
