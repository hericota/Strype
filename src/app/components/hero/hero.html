<div class="header-container">

    <!-- Video de fundo -->
    <video autoplay [volume]="0" loop class="hero-video">
        <source src="/assets/brands-videos-n-photos/Nike-video.mp4"
            alt="Video de um jogador de basquete utilizando um tenis da Nike">
    </video>

    <!-- Overlay -->
    <div class="hero-overlay"></div>

    <header class="header-content">

        <nav class="navigation">
            <div class="logo-col">
                <a routerLink="/">
                    <img id="strype-logo" src="/assets/STRYPE-LOGO.png" alt="Logo da Strype">
                </a>
            </div>

            <div class="col-1">
                <a routerLink="/produtos">Adidas</a>
                <a routerLink="/produtos">Nike</a>
                <a routerLink="/produtos">The North Face</a>
                <a routerLink="/produtos">Midias e equipamentos</a>
                <a routerLink="/telaAdmin">Admin</a>
            </div>
        </nav>

        <div class="col-2">
            <div class="search-bar">
                <img src="/assets/SEARCH-ICON.png" alt="Icone de pesquisa" id="search-icon">

                <input
                    type="search"
                    placeholder="Pesquisar"
                    aria-label="Pesquisar produtos"
                    [(ngModel)]="termoPesquisa"
                    (keyup.enter)="pesquisar()"
                >
            </div>

            <div class="icons">
                <a routerLink="#">
                    <img src="/assets/CART-ICON.png" alt="Icone de Carrinho" id="cart-icon">
                </a>

                <a routerLink="#">
                    <img src="/assets/USER-ICON.png" alt="Icone de usuario" id="user-icon">
                </a>
            </div>
        </div>

    </header>

    <img src="/assets/STRYPE-LOGO.png" alt="Logo da Strype" class="brand-hero-logo">
    
</div>
