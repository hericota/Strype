<main class="pagina-produtos">

    <header class="cabecalho">
      <h1>GERENCIAR PRODUTOS</h1>
      <p>Visualize e escolha um produto para editar.</p>
    </header>

    <div class="campo-pesquisa">
      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <circle cx="11" cy="11" r="7"></circle>
        <path d="M20 20L16.65 16.65"></path>
      </svg>

      <input
        type="search"
        placeholder="Pesquisar por nome ou ID"
        aria-label="Pesquisar produto"

    <div class="tabela-produtos">

      <div class="cabecalho-tabela">

      @for (produto of consumoService.produtoCadastrado.value(); track $index){
        <article class="produto">
            <div class="informacoes-produto">
            <img class="numero bege" src="{{produto.urlImagem}}" alt="">

            <div class="nome-produto">
                <strong>{{produto.nome}}</strong>
                <small>ID {{produto.id}}</small>
            </div>
            </div>

            <span class="categoria">{{produto.descricao}}</span>
            <strong class="preco">R$ {{produto.preco}}</strong>

            <button
            class="botao-editar"
            type="button"
            aria-label="Editar {{produto.nome}}"
            >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 20H5a1 1 0 0 1-1-1v-7"></path>
