
<div class="card">
    @for (produto of consumoService.produtoCadastrado.value(); track $index) {
        <div>
            <a routerLink="#" class="produto">
                <div>
                    <img src={{produto.urlImagem}}>
                    <p class="name">{{produto.nome}}</p>
                    <p class="name text">Casual</p>
                    <p class="name">R$ {{produto.preco}}</p>
                </div>
            </a>
        </div>
    }
</div>
