<app-hero></app-hero>
<!-- Sessão de promoções -->
<div class="promotions">
    <aside class="promo-banner">
        <span class="promo-subtitle">ÚLTIMOS DIAS</span>
        <h2 class="promo-title">SALE</h2>
        <p class="promo-discount">30% OFF</p>
        <span class="promo-tagline">UP TO</span>
    </aside>
    <div class="options">
        <a class="promo-btn" routerLink=""><span>COMPRAR</span></a>
        <a class="promo-btn" routerLink=""><span>SAIBA MAIS</span></a>
    </div>
</div>

<!-- Sessão NIKE -->
<div class="nike-section">
    <h2 class="nike-title">Confira Sneakers Nike</h2>
    <div class="sneakers-cards">
        <div class="cards-n-text">
            <a routerLink="#" class="sneaker-link">
                <img src="/assets/Nike-Sneakers/AF1.png" alt="Imagem de um tenis Nike Air Force 1" class="sneaker-img">
                <h3 class="sneaker-tagline">Air Force 1</h3>
            </a>
        </div>
        <div class="cards-n-text">
            <a routerLink="#" class="sneaker-link">
                <img src="/assets/Nike-Sneakers/PANDA.png" alt="Imagem de um tenis Nike Dunk Panda" class="sneaker-img">
                <h3 class="sneaker-tagline">Dunk</h3>
            </a>
        </div>
        <div class="cards-n-text">
            <a routerLink="#" class="sneaker-link">
                <img src="/assets/Nike-Sneakers/JORDAN.png" alt="Imagem de um tenis Nike Jordan 1" class="sneaker-img">
                <h3 class="sneaker-tagline">Air Jordan 1</h3>
            </a>
        </div>
        <div class="cards-n-text">
            <a routerLink="#" class="sneaker-link">
                <img src="/assets/Nike-Sneakers/AMX.png" alt="Imagem de um tenis Nike Air Max" class="sneaker-img">
                <h3 class="sneaker-tagline">Air Max</h3>
            </a>
        </div>
    </div>
</div>

<!-- Sessão ADIDAS -->

<div class="adidas-section">
    <h2 class="adidas-title">Adidas</h2>
    <div class="adidas-video">
        <video autoplay [volume]="0" loop class="" >
        <source src="/assets/brands-videos-n-photos/Adidas-video.mp4" alt="Video de um tenis da adidas">
        </video>
    </div>
    <div class="adidas-cards">
        <div class="adidas-card-n-text">
            <img src="/assets/Adidas-imgs/adidas-sneaker.png" alt="Imagem de um Adidas Sneaker" class="adidas-img">
            <h3 class="adidas-tagline">LifeStyle</h3>
        </div>
        <div class="adidas-card-n-text">
            <img src="/assets/Adidas-imgs/adidas-lifestyle.png" alt="Imagem de um modelo usando roupas da Adidas" class="adidas-img">
            <h3 class="adidas-tagline">Roupas</h3>
        </div>
        <div class="adidas-card-n-text">
            <img src="/assets/Adidas-imgs/adidas-slide.png" alt="Imagem de um chinelo slide da Adidas" class="adidas-img">
            <h3 class="adidas-tagline">Chinelos</h3>
        </div>
        <div class="adidas-card-n-text">
            <img src="/assets/Adidas-imgs/adidas-runner.png" alt="Imagem de uma corredora da Adidas" class="adidas-img">
            <h3 class="adidas-tagline">Esportes</h3>
        </div>
    </div>
</div>

<app-footer></app-footer>
